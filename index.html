<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX_template</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="navbar">

            <!-- logo section -->
            <div class="logo_div">

                <div class="logo">
                    <img src="images.png" alt="scaleX_logo">
                </div>
              
                <div class="Logo_name"> ScaleX </div>

            </div>

            <!-- Navbar headings -->
             <div class="Nav_heading_div">
                <div class="navbar_heading">Home</div>
                <div class="navbar_heading">About Us</div>
                <div class="navbar_heading">Blogs</div>
                <div class="navbar_heading">Contact Us</div>
            </div>

             <!-- Get Started Button -->

             <div class="Get_Started_button">
                <div class="option_design">
                    <div class="left_rounded_border"></div>
                    <button class="options">Get Started</button>
                    <div class="right_rounded_border"></div>
               </div>
             </div>
        </div>
        <div class="main_content">
              
            <!-- hero section -->
             <div class="hero_section">Insights & Blogs</div>

             <!-- menu section -->
            <div class="menu_section">
                <div class="option_design">
                    <div class="left_rounded_border" id="first_option_left"></div>
                    <div class="options" id="orange_option">All</div>
                    <div class="right_rounded_border" id="first_option_right"></div>
               </div>
               
                <div class="option_design">
                    <div class="left_rounded_border"></div>
                    <div class="options">Tech</div>
                    <div class="right_rounded_border"></div>
               </div>
                
               <div class="option_design">
                    <div class="left_rounded_border"></div>
                    <div class="options">SaaS</div>
                    <div class="right_rounded_border"></div>
               </div>

                <div class="option_design">
                    <div class="left_rounded_border"></div>
                    <div class="options">Marketing</div>
                    <div class="right_rounded_border"></div>
               </div>

            </div>


            <!-- carousel section -->
             <div class="carousel_section">

                <div class="carouselCard">
                    <!-- Carousel image -->
                    <div class="carousel_image">
                        <img src="./src/martini_glass.jpg" alt="martini_image">
                    </div>
                    
                    <!-- Carousel content -->
                    <div class="carousel_content">
                        <div class="Carousel_tagName">Tech</div>
                        <div><b>The Ultimate guide to<br> SaaS Marketing</b></div>
                         <div class="Date">May 23, 2005</div>
                    </div>
                </div>


                <div class="carouselCard">
                    <!-- Carousel image -->
                    <div class="carousel_image">
                        <img src="./src/middle_pic.jpg" alt="middle_image">
                    </div>
                    
                    <!-- Carousel content -->
                    <div class="carousel_content">
                        <div class="Carousel_tagName">SaaS</div>
                        <div><b>5 Key Trends in SaaS <br>Growth For 2025</b></div>
                         <div class="Date">May 23, 2005</div>
                    </div>
                </div>


                <div class="carouselCard">
                    <!-- Carousel image -->
                    <div class="carousel_image">
                        <img src="./src/cat_image.jpg" alt="cat_image">
                    </div>
                    
                    <!-- Carousel content -->
                    <div class="carousel_content">
                        <div class="Carousel_tagName">Marketing</div>
                        <div><b>How Data-Driven<br> Strategies Are Important</b></div>
                        <div class="Date">May 23, 2005</div>
                    </div>
                </div>
                                
            </div>


        </div>

    </div>
</body>
</html>
